<script>// Clé personnelle : PBKDF2-SHA256 (600 000 tours) du mot de passe, salé par l'identifiant
const ACCESS_SALT = (id) => 'LiDiv-acces-v1|' + id.trim().toLowerCase();
const PBKDF2_ROUNDS = 600000;
const deriveSeed = async (id, password) => {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(ACCESS_SALT(id)), iterations: PBKDF2_ROUNDS }, base, 256);
  return new Uint8Array(bits);

const b64 = (u8) => btoa(String.fromCharCode(...u8));

  var KEY = 'lidiv_acces';
  var form = document.getElementById('k');
  var open = async function (seed) {
    var kp = nacl.box.keyPair.fromSecretKey(seed);
    var k = nacl.box.open(unb64(BOX.key), unb64(BOX.nonce), unb64(BOX.eph), kp.secretKey);
    if (!k) return false;
    var aes = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(BOX.iv) }, aes, unb64(BOX.data));
    var html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
    return true;
  };
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { saved = null; }
  if (saved) {
    open(unb64(saved)).then(function (ok) { if (!ok) { try { localStorage.removeItem(KEY); } catch (e) {} } }).catch(function () {});
  }
  // Page blanche : le formulaire n'apparaît qu'après trois touches rapides
  var taps = [];
  document.addEventListener('pointerdown', function (e) {
    if (form.contains(e.target)) return;
    var now = Date.now();
    taps = taps.filter(function (t) { return now - t < 900; }).concat(now);
    if (taps.length >= 3) { form.style.display = 'block'; document.getElementById('u').focus(); taps = []; }
  });
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var u = document.getElementById('u'), p = document.getElementById('p');
    var remember = document.getElementById('r').checked;
    var seed = await deriveSeed(u.value, p.value);
    var ok = false;
    if (remember) { try { localStorage.setItem(KEY, b64(seed)); } catch (er) {} }
    try { ok = await open(seed); } catch (err) { ok = false; }
    if (ok) return;
    try { localStorage.removeItem(KEY); } catch (er) {}
    p.value = ''; form.style.display = 'none';
  });
})();
