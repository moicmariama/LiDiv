<script>// Clé personnelle : PBKDF2-SHA256 (600 000 tours) du mot de passe, salé par l'identifiant
const ACCESS_SALT = (id) => 'LiDiv-acces-v1|' + id.trim().toLowerCase();
const PBKDF2_ROUNDS = 600000;
const deriveSeed = async (id, password) => {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(ACCESS_SALT(id)), iterations: PBKDF2_ROUNDS }, base, 256);
  return new Uint8Array(bits);

const b64 = (u8) => btoa(String.fromCharCode(...u8));

  var KEY = 'lidiv_acces';
  var form = document.getElementById('k');
  var open = async function (seed) {
    var kp = nacl.box.keyPair.fromSecretKey(seed);
    var k = nacl.box.open(unb64(BOX.key), unb64(BOX.nonce), unb64(BOX.eph), kp.secretKey);
    if (!k) return false;
    var aes = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(BOX.iv) }, aes, unb64(BOX.data));
